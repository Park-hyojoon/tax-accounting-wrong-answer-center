    const problems=[
      {id:'trading-security',type:'단기매매증권 평가',title:'회사별 단기매매증권 기말평가',prompt:'[12월 31일] 보유 중인 단기매매증권을 회사별로 각각 공정가치 평가하시오. 취득원가가 아니라 결산 전 장부금액과 공정가치를 비교하여 필요한 전표를 입력하시오.',lookupTitle:'단기매매증권 평가자료 조회',lookup:[['주식명','취득원가','결산 전 장부금액','공정가치'],['(주)미래전자','640,000원','820,000원','560,000원'],['(주)한결상사','420,000원','690,000원','1,020,000원']],hint:'각 회사별로 장부금액과 공정가치를 비교합니다. 미래전자는 260,000원 하락, 한결상사는 330,000원 상승했습니다. 두 회사의 평가손익을 서로 상계하지 않습니다.',explanation:'미래전자는 820,000-560,000=260,000원의 평가손실이므로 단기매매증권을 감소시킵니다. 한결상사는 1,020,000-690,000=330,000원의 평가이익이므로 단기매매증권을 증가시킵니다. 회사별로 각각 회계처리합니다.',answers:[A('D','단기매매증권평가손실',260000),A('C','단기매매증권',260000),A('D','단기매매증권',330000),A('C','단기매매증권평가이익',330000)]},

    function fmt(iso){try{return new Intl.DateTimeFormat('ko-KR',{dateStyle:'medium',timeStyle:'medium'}).format(new Date(iso))}catch(e){return iso}}function safe(raw,suffix=''){return (raw||'결산정리사항_학습기록').replace(/[<>:"/\\|?*\x00-\x1F]/g,'-').trim().replace(/\.md$/i,'')+suffix+'.md'}function tableRows(rows){const l=['| 차/대변 | 계정과목 | 금액 | 판/제 | 적요 | 거래처 |','|---|---|---:|---|---|---|'];const f=filled(rows);if(!f.length)l.push('| - | 입력 없음 | 0원 | - | - | - |');else f.forEach(r=>l.push(`| ${r.side==='D'?'차변':'대변'} | ${r.account||'미선택'} | ${money(normMoney(r.amount))} | ${r.division||'-'} | ${r.memo||'-'} | ${r.partner||'-'} |`));return l}function answerRows(rows){return ['| 차/대변 | 계정과목 | 금액 | 판/제 | 적요 | 거래처 |','|---|---|---:|---|---|---|',...rows.map(r=>`| ${r.side==='D'?'차변':'대변'} | ${r.account} | ${money(r.amount)} | ${r.division||'-'} | ${r.memo||'-'} | ${r.partner||'-'} |`)]}
    function isToday(iso){const d=new Date(iso);if(Number.isNaN(d.getTime()))return false;return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`===localDate()}
    function todayRecords(){return problems.map((p,i)=>{const s=cs(i);return {p,i,s,history:(s.history||[]).filter(h=>isToday(h.at))}}).filter(x=>x.history.length)}
    function record(list=todayRecords()){
      const attempts=list.reduce((n,x)=>n+x.history.length,0),correct=list.reduce((n,x)=>n+x.history.filter(h=>h.correct).length,0),wrong=attempts-correct;
      const l=['# 전산회계 1급 결산정리사항 오늘 학습기록','',`- 학습일: ${localDate()}`,`- 저장 시각: ${fmt(nowIso())}`,`- 오늘 채점한 문제: ${list.length}문제`,`- 오늘 채점 시도: ${attempts}회`,`- 오늘 정답 시도: ${correct}회`,`- 오늘 오답 시도: ${wrong}회`,'- 기록 범위: 오늘 채점한 문제와 오늘의 입력·답변 이력',''];
      list.forEach(({p,s,history},n)=>{const last=history[history.length-1];l.push(`## ${n+1}. ${p.title} (${p.type})`,'',`**문제:** ${p.prompt}`,'',`- 훈련 상태: ${s.archived?'사용자가 숨긴 문제':s.selfPassed?'스스로 정답 인정(통과)':s.passed?'통과':'학습 중'}`,`- 현재 결산자료 조회 상태: ${s.lookup?'조회함':'조회하지 않음'}`,`- 오늘 마지막 결과: ${last.correct?'정답':'오답'}`,`- 오늘 채점 ${history.length}회 / 틀림 ${history.filter(h=>!h.correct).length}회`,'','### 오늘 마지막 입력','',...tableRows(last.rows||[]),'','### 정답','',...answerRows(p.answers),'',`**해설:** ${p.explanation}`,'','### 오늘 답변 이력','');history.forEach((h,k)=>{l.push(`#### ${k+1}차 (${fmt(h.at)}): ${h.correct?'정답':'오답'}, ${h.matched}/${h.total||p.answers.length}개 일치`,'',...tableRows(h.rows||[]),'')});l.push('---','')});
      l.push('## AI에게 전달할 요청 예시','', '> 오늘 결산정리사항 학습기록에서 틀린 문제와 계산 과정을 분석하고, 같은 조회·입력 구조를 유지한 전산회계 1급 실무 응용문제를 만들어 주세요. 계정과목은 직접 입력하지 않고 선택하도록 해 주세요.','');return l.join('\n')
    }
    function todayRecordPayload(){const list=todayRecords();return list.length?{date:localDate(),fileName:safe($('#recordFileName').value,'_오늘'),content:record(list),problemCount:list.length}:null}
    async function saveTodayRecord(){
      const payload=todayRecordPayload(),status=$('#saveStatus');
      if(!payload){status.textContent='오늘 채점한 학습 기록이 없습니다. 문제를 채점한 뒤 저장해 주세요.';return}
      const name=payload.fileName,content=payload.content;let fallbackMessage='';
      if(await window.TrainingGitHub?.canSaveRemote?.()){
        status.textContent='오늘 학습기록을 GitHub에 저장하고 있습니다.';
        try{await window.TrainingGitHub.saveDailyRecord('closing',payload.date,content);status.textContent='오늘 결산 학습기록을 GitHub에 저장했습니다.';return}
        catch(error){fallbackMessage=`GitHub 저장에 실패하여 이 기기에 저장합니다. (${error?.message||'연결 오류'}) `}
      }
      try{if('showSaveFilePicker'in window){const h=await window.showSaveFilePicker({suggestedName:name,types:[{description:'Markdown 학습기록',accept:{'text/markdown':['.md']}}]});const w=await h.createWritable();await w.write(content);await w.close();status.textContent=`${fallbackMessage}${h.name} 파일로 저장했습니다.`;return}}
      catch(e){if(e.name==='AbortError'){status.textContent='저장을 취소했습니다.';return}}
      const b=new Blob([content],{type:'text/markdown;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status.textContent=`${fallbackMessage}${name} 다운로드를 시작했습니다.`
    }
    $('#saveToday').addEventListener('click',saveTodayRecord);$('#resetLearning').addEventListener('click',()=>{if(confirm('14문제의 모든 입력과 채점 이력을 지울까요?')){localStorage.removeItem(KEY);location.reload()}});
    const CM={r:'ㄱ',R:'ㄲ',s:'ㄴ',e:'ㄷ',E:'ㄸ',f:'ㄹ',a:'ㅁ',q:'ㅂ',Q:'ㅃ',t:'ㅅ',T:'ㅆ',d:'ㅇ',w:'ㅈ',W:'ㅉ',c:'ㅊ',z:'ㅋ',x:'ㅌ',v:'ㅍ',g:'ㅎ'},VM={k:'ㅏ',o:'ㅐ',i:'ㅑ',O:'ㅒ',j:'ㅓ',p:'ㅔ',u:'ㅕ',P:'ㅖ',h:'ㅗ',y:'ㅛ',n:'ㅜ',b:'ㅠ',m:'ㅡ',l:'ㅣ'},CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'],JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'],JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'],VC={'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'},FC={'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'},isC=x=>CHO.includes(x),isV=x=>JUNG.includes(x);function toKo(raw){const j=[...raw].map(x=>CM[x]||VM[x]||x);let o='',i=0;while(i<j.length){const x=j[i];if(isC(x)&&isV(j[i+1])){let c=CHO.indexOf(x),v=j[i+1];i+=2;if(isV(j[i])&&VC[v+j[i]]){v=VC[v+j[i]];i++}let f='';if(isC(j[i])&&JONG.includes(j[i])){const a=j[i],b=j[i+1],z=j[i+2];if(isV(b)){}else if(isC(b)&&FC[a+b]&&!isV(z)){f=FC[a+b];i+=2}else{f=a;i++}}o+=String.fromCharCode(44032+c*588+JUNG.indexOf(v)*28+JONG.indexOf(f))}else if(isV(x)&&isV(j[i+1])&&VC[x+j[i+1]]){o+=VC[x+j[i+1]];i+=2}else{o+=x;i++}}return o}function resetKo(){$$('[data-ko-auto]').forEach(x=>{x.dataset.raw='';x.dataset.base=x.value})}function setupKo(x){x.dataset.raw='';x.dataset.base=x.value;x.addEventListener('focus',()=>{x.dataset.raw='';x.dataset.base=x.value});x.addEventListener('keydown',e=>{if(!$('#koAuto').checked||e.ctrlKey||e.altKey||e.metaKey)return;const r=x.dataset.raw||'',end=x.selectionStart===x.value.length&&x.selectionEnd===x.value.length;if(e.key==='Backspace'&&r&&end){e.preventDefault();const n=r.slice(0,-1);x.dataset.raw=n;x.value=(x.dataset.base||'')+toKo(n);x.dispatchEvent(new Event('input',{bubbles:true}));return}if(/^[A-Za-z]$/.test(e.key)&&end){e.preventDefault();if(!r)x.dataset.base=x.value;const n=r+e.key;x.dataset.raw=n;x.value=(x.dataset.base||'')+toKo(n);x.dispatchEvent(new Event('input',{bubbles:true}));return}x.dataset.raw='';x.dataset.base=x.value})}$$('[data-ko-auto]').forEach(setupKo);
    (function(){
    if(typeof window.TrainingGitHub?.installSyncBar!=='function'){const button=document.querySelector('#syncAll');if(button)button.addEventListener('click',()=>alert('동기화 기능을 불러오지 못했습니다. Ctrl+F5로 새로고침한 뒤 다시 눌러주세요.'));return}
