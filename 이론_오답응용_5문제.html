<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>전산회계 1급 · 이론 기출 오답 훈련</title>
  <style>
    :root{--navy:#15345e;--blue:#2d78c5;--sky:#e7f5ff;--mint:#e9fbf3;--yellow:#fff4b8;--red:#ce3f4b;--green:#137e57;--line:#cadceb;--ink:#172235;--muted:#65748a}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:linear-gradient(135deg,#f5fbff 0%,#fffdf3 100%);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:18px;line-height:1.65}
    button,input{font:inherit}
    input[type="text"]{ime-mode:active}
    .wrap{width:min(1080px,94vw);margin:30px auto 80px}
    .top-nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);box-shadow:0 5px 20px rgba(44,91,128,.08);backdrop-filter:blur(12px)}
    .nav-inner{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:10px 20px}
    .nav-link{flex:0 0 auto;text-decoration:none;border:2px solid #d2e4f2;border-radius:13px;padding:7px 14px;background:#fff;color:#34546d;font-weight:800}
    .nav-link:hover,.nav-link:focus-visible{border-color:#68a9df;background:#edf8ff;outline:none}
    .nav-link.active{background:var(--blue);border-color:var(--blue);color:#fff}
    .nav-sync{display:flex;align-items:center;margin-left:auto}
    .nav-sync-title{font-weight:900;color:var(--navy);letter-spacing:.02em}
    .nav-sync-button{min-height:38px;padding:6px 11px;border:2px solid var(--line);border-radius:11px;background:#fff;color:var(--navy);font:inherit;font-weight:900;font-size:.87em;cursor:pointer}
    .nav-sync-button:hover:not(:disabled){border-color:var(--blue);background:var(--sky)}
    .nav-sync-button:focus-visible{outline:3px solid #bde1fb;outline-offset:2px}
    .nav-sync-button:disabled{opacity:.6;cursor:progress}
    .nav-sync-button{white-space:nowrap}
    .nav-sync-button.primary{border-color:var(--blue);background:var(--blue);color:#fff}
    .nav-sync-button.primary:hover:not(:disabled){background:#0d5eaa;border-color:#0d5eaa;color:#fff}
        @media(max-width:760px){.nav-sync{width:100%;margin-left:0}.nav-sync-button{flex:1 1 auto}}
    .hero{background:#fff;border:2px solid #cde5f7;border-radius:24px;padding:28px 30px;box-shadow:0 12px 35px rgba(40,84,122,.1)}
    h1{margin:0 0 8px;color:var(--navy);font-size:clamp(29px,4vw,42px);line-height:1.25}
    h2{color:var(--navy)}
    .hero p{margin:7px 0}
    .notice{margin-top:16px;padding:14px 17px;border-radius:13px;background:var(--yellow);font-weight:800}
    .dashboard{position:sticky;top:calc(var(--nav-h,62px) + 8px);z-index:10;margin:18px 0;background:rgba(247,252,255,.95);backdrop-filter:blur(8px);border:1px solid #d5e6f2;border-radius:17px;padding:13px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
    .progress{display:flex;align-items:center;gap:12px;margin-left:auto;font-weight:800;color:var(--navy)}
    .progress-bar{width:180px;height:14px;background:#dfeaf2;border-radius:99px;overflow:hidden}
    .progress-bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#39a7f0,#27b47e);transition:.25s}
    @media(max-width:760px){.progress{width:100%;margin-left:0}.progress-bar{flex:1 1 auto}}
    .sort-label{display:flex;align-items:center;gap:8px;white-space:nowrap;margin-left:0;font-weight:900;color:var(--navy)}
    .sort-select{border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--navy);font-weight:800;font-size:inherit;padding:9px 12px;cursor:pointer}
    .sort-select:focus-visible{border-color:#5d9ed2;outline:none}
    @media(max-width:760px){.sort-label{width:100%;margin-left:0;align-items:stretch;flex-direction:column;gap:5px}.sort-select{width:100%}}
    .btn{border:0;border-radius:12px;padding:10px 17px;cursor:pointer;font-weight:900;color:#fff;background:var(--blue);box-shadow:0 4px 12px rgba(45,120,197,.2)}
    .btn:hover{filter:brightness(.96);transform:translateY(-1px)}
    .btn.green{background:var(--green)}
    .btn.secondary{background:#fff;color:var(--navy);border:2px solid var(--line);box-shadow:none}
    .btn.danger{background:#fff;color:var(--red);border:2px solid #e8b3b8;box-shadow:none}
    .question{background:#fff;border:2px solid #d9e7f2;border-radius:22px;padding:24px;margin:22px 0;box-shadow:0 8px 24px rgba(44,91,128,.07)}
    .question.correct{border-color:#73c8a6;background:#fbfffd}
    .question.wrong{border-color:#ee9fa7;background:#fffdfd}
    .qhead{display:flex;gap:14px;align-items:flex-start}
    .qnum{display:grid;place-items:center;min-width:49px;height:49px;border-radius:14px;background:var(--navy);color:#fff;font-size:22px;font-weight:900}
    .qhead h3{margin:0;color:var(--navy);font-size:24px;line-height:1.4}
    .tag{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:99px;background:var(--sky);color:#246090;font-size:14px;font-weight:800}
    .prompt{margin:16px 0;padding:18px;background:#f8fbfe;border-left:6px solid #71b8ea;border-radius:8px;font-size:20px}
    .data-box{margin:12px 0 16px;padding:15px 18px;background:#fffbed;border:1px solid #eedf9a;border-radius:13px;white-space:pre-line}
    .choices{display:grid;gap:11px;margin:16px 0}
    .choice{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:2px solid #d9e5ee;border-radius:13px;cursor:pointer;background:#fff;transition:.15s}
    .choice:hover{border-color:#80b8e0;background:#f5fbff}
    .choice:has(input:checked){border-color:var(--blue);background:#eaf6ff;box-shadow:0 0 0 2px #cbe7fb inset}
    .choice input{width:23px;height:23px;margin-top:3px;accent-color:var(--blue);flex:none}
    .choice-number{font-weight:900;color:var(--navy)}
    .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:15px 0}
    .result{font-weight:900;min-height:30px}.result.ok{color:var(--green)}.result.no{color:var(--red)}
    .attempt{margin-left:auto;color:var(--muted);font-size:15px;font-weight:800}
    details{margin-top:11px;border:1px solid var(--line);border-radius:12px;background:#fffdf5;overflow:hidden}
    details summary{cursor:pointer;padding:11px 15px;font-weight:900;color:#684d00;list-style:none}
    details summary::-webkit-details-marker{display:none}
    .detail-body{padding:9px 16px 16px;border-top:1px solid #eee3bd}
    input[type="text"]:focus{outline:3px solid #bde1fb;border-color:#4b98d3}
    .save-panel{margin:34px 0;background:#fff;border:2px solid #bcdcca;border-radius:22px;padding:25px;box-shadow:0 9px 28px rgba(32,114,81,.08)}
    .save-panel h2{margin-top:0}
    .path{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 14px;background:#eef9f4;border-radius:12px;color:#185f47;font-weight:800;word-break:break-all}
    .filename-row{display:grid;grid-template-columns:minmax(240px,1fr) auto auto;gap:10px;margin-top:16px}
    .filename-row input{width:100%;min-height:48px;padding:9px 12px;border:2px solid #cad9e4;border-radius:11px}
    .checks{display:flex;flex-wrap:wrap;gap:18px;margin-top:15px}
    .checks label{display:flex;align-items:center;gap:8px;font-weight:800}
    .checks input{width:22px;height:22px;accent-color:var(--green)}
    .save-status{min-height:29px;margin:12px 0 0;font-weight:900;color:var(--green)}
    .help{font-size:15px;color:var(--muted)}
    .footer{text-align:center;color:var(--muted);font-size:15px;margin-top:28px}
    .star-note{margin:8px 0 0;padding:8px 12px;border-radius:10px;background:#fff4c2;color:#6b4a00;font-weight:900}
    .variant-badge{background:#e8f0ff;color:#1d4d9b;margin-left:6px}
    .star-one[aria-pressed="true"]{background:#ffd54a;border-color:#e0b100;color:#5a3d00}
    .star-tools{display:flex;justify-content:flex-end;gap:8px;margin:12px 0}
    .star-group{margin:18px 0 26px}
    .star-group-title{margin:0 0 10px;font-size:1.15rem;color:var(--navy)}
    .star-group-title small{margin-left:8px;font-size:.85rem;color:var(--muted)}
    .star-item{margin:8px 0;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
    .star-item>summary{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;font-weight:900;list-style:none}
    .star-item>summary::-webkit-details-marker{display:none}
    .star-item>summary::before{content:'▸';color:var(--muted)}
    .star-item[open]>summary::before{content:'▾'}
    .star-item>summary .qnum{width:30px;height:30px;font-size:.9rem}
    .star-item-meta{margin-left:auto;font-size:.85rem;font-weight:700;color:var(--muted)}
    .star-item>.question{margin:0;border:0;border-top:1px dashed var(--line);border-radius:0;box-shadow:none}
    .sort-label[hidden]{display:none}
    @media(max-width:760px){body{font-size:16px}.hero,.question,.save-panel{padding:18px}.prompt{font-size:18px}.dashboard{position:static}.filename-row{grid-template-columns:1fr}.attempt{width:100%;margin-left:0}}
    @media print{.dashboard,.actions,.save-panel,.footer{display:none}.question{break-inside:avoid;box-shadow:none}details:not([open]){display:none}}
  </style>
</head>

      <div class="path"><span>D:\00. 학습센터\기출문제 연습코너\또 틀렸다!</span><button class="btn secondary" id="copyPath" type="button">폴더 경로 복사</button></div>

<script src="training-ui.js?v=8"></script>
  <script>
    const problems=loadTrainingProblems();

    const STORAGE_KEY='exam-20260914-theory';
    const circled=['①','②','③','④','⑤'];
    const $=(s,r=document)=>r.querySelector(s);
    const $$=(s,r=document)=>[...r.querySelectorAll(s)];
    const nowIso=()=>new Date().toISOString();
    const localDate=()=>{const d=new Date(),o=d.getTimezoneOffset()*60000;return new Date(d-o).toISOString().slice(0,10)};
    problems.forEach(p=>{if(!p.addedDate)p.addedDate='2026-09-01'});
    const defaultState=()=>({startedAt:nowIso(),updatedAt:nowIso(),answers:{},checked:{},attempts:{},history:{},notes:{},passed:{},archived:{},passedAt:{},archivedAt:{},trainingCenterRestored:{},starred:{},starredAt:{},fileName:`이론_새학습_학습기록_${localDate()}`,koAuto:true});
    let state=loadState();

    function loadState(){
      try{const s=Object.assign(defaultState(),JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'));s.passed=s.passed||{};s.archived=s.archived||{};s.passedAt=s.passedAt||{};s.archivedAt=s.archivedAt||{};s.trainingCenterRestored=s.trainingCenterRestored||{};s.starred=s.starred||{};s.starredAt=s.starredAt||{};problems.forEach(p=>{const wasCorrect=s.checked[p.id]===true||(s.history[p.id]||[]).some(h=>h.correct);s.passed[p.id]=s.trainingCenterRestored[p.id]?false:Boolean(s.passed[p.id]||wasCorrect);s.archived[p.id]=Boolean(s.archived[p.id])});return s}catch(e){return defaultState()}
    }
    function persist(){state.updatedAt=nowIso();localStorage.setItem(STORAGE_KEY,JSON.stringify(state));updateDashboard()}
    function choiceText(p,n){return Number.isInteger(n)?`${circled[n]} ${p.choices[n]}`:'미선택'}
    function questionHtml(p,i){
      const selected=state.answers[p.id];
      return `<article class="question" data-id="${p.id}" data-added-date="${p.addedDate}">
        <div class="qhead"><span class="qnum">${i+1}</span><div><h3>${p.prompt}</h3><span class="tag">${p.type}</span>${p.variantOf!=null?`<span class="tag variant-badge">AI 응용문제</span>`:''}</div></div>
        <p class="star-note" hidden>★ 이 문제는 특별히 훈련이 필요합니다.</p>
        ${p.data?`<div class="data-box">${p.data}</div>`:''}
        <div class="choices">${p.choices.map((c,n)=>`<label class="choice"><input type="radio" name="q-${p.id}" value="${n}" ${Number(selected)===n?'checked':''}><span class="choice-number">${circled[n]}</span><span>${c}</span></label>`).join('')}</div>
        <div class="actions"><button class="btn check-one" type="button">채점하기</button><button class="btn secondary archive-one" type="button">이 문제 영구 삭제</button><button class="btn secondary star-one" type="button" aria-pressed="false" title="이 문제는 특별히 훈련이 필요합니다. AI가 학습기록에서 이 표시를 보면 응용문제 1개를 더 만듭니다.">★ 특별 훈련</button><span class="result" aria-live="polite"></span><span class="attempt"></span></div>
        <details><summary>정답 · 해설 보기</summary><div class="detail-body"><p><strong>정답: ${circled[p.answer]} ${p.choices[p.answer]}</strong></p><p>${p.explanation}</p><p><strong>핵심:</strong> ${p.key}</p></div></details>
      </article>`
    }
    function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    $('#questions').innerHTML=problems.map(questionHtml).join('');
    $('#fileName').value=state.fileName||defaultState().fileName;
    $('#koAuto').checked=state.koAuto!==false;

    function getProblem(id){return problems.find(p=>p.id===id)}
    function deleteTheory(id){state.deleted=state.deleted||{};state.deletedAt=state.deletedAt||{};state.deleted[id]=true;state.deletedAt[id]=state.selfPassedAt?.[id]||nowIso();['answers','checked','attempts','history','passed','archived','passedAt','archivedAt','restoredAt','trainingCenterRestored','selfPassed','selfPassedAt','starred','starredAt'].forEach(k=>{if(state[k]&&typeof state[k]==='object')delete state[k][id]});persist()}
    function toggleStar(card){
      const id=card.dataset.id;state.starred=state.starred||{};state.starredAt=state.starredAt||{};
      if(state.starred[id]){delete state.starred[id];delete state.starredAt[id]}else{state.starred[id]=true;state.starredAt[id]=nowIso()}
      persist();renderCard(card);
    }
    function wrongCount(id){return (state.history[id]||[]).filter(h=>h.correct===false&&!h.cancelledAt).length}
    const todayView=new URLSearchParams(location.search).get('view')==='today';
    const typeView=(new URLSearchParams(location.search).get('type')||'').trim();
    const starView=new URLSearchParams(location.search).get('view')==='star';
    const weaknessRefs=new Set((new URLSearchParams(location.search).get('weakrefs')||'').split(',').filter(Boolean));
    // 응용문제의 원문제도 ★ 상태와 관계없이 같은 묶음에 표시한다. 이론은 id 문자열로 원문제를 가리킨다.
    const variantSourceIds=new Set(problems.filter(p=>p.variantOf!=null).map(p=>p.variantOf));
    const sessionPassed=new Set();
    function renderCard(card){
      const id=card.dataset.id,p=getProblem(id),checked=state.checked[id],attempts=state.attempts[id]||0,result=$('.result',card);
      card.hidden=!TrainingSeason.matches(p)||state.deleted?.[id]?true:starView?!(Boolean(state.starred?.[id])||p.variantOf!=null||variantSourceIds.has(id)):typeView?(p.variantOf!=null||(p.type||'').trim()!==typeView):Boolean(!weaknessRefs.has(id)&&((state.passed[id]&&!sessionPassed.has(id))||state.archived[id]||(todayView&&card.dataset.addedDate!==localDate())));
      $('.star-one',card).setAttribute('aria-pressed',String(Boolean(state.starred?.[id])));$('.star-note',card).hidden=!state.starred?.[id];
      card.classList.toggle('correct',checked===true);card.classList.toggle('wrong',checked===false);
      result.className='result'+(checked===true?' ok':checked===false?' no':'');
      result.textContent=checked===true?'정답입니다! 통과 처리되어 다음 방문부터 숨겨집니다.':checked===false?`오답입니다. 다시 풀거나 정답·해설을 확인해보세요.`:state.answers[id]!==undefined?'선택 내용이 자동 저장되었습니다.':'';
      $('.attempt',card).textContent=`채점 ${attempts}회 · 틀림 ${wrongCount(id)}회`;
    }
    $$('.question').forEach(card=>{
      const id=card.dataset.id;
      $$('input[type="radio"]',card).forEach(r=>r.addEventListener('change',()=>{state.answers[id]=Number(r.value);delete state.checked[id];persist();renderCard(card)}));
      $('.check-one',card).addEventListener('click',()=>grade(card));
      $('.archive-one',card).addEventListener('click',()=>{if(!confirm('이 문제를 영구 삭제할까요?\n목록·통계에서 완전히 사라지고 복구할 수 없습니다.'))return;deleteTheory(id);card.hidden=true;updateDashboard()});
      $('.star-one',card).addEventListener('click',()=>toggleStar(card));
      renderCard(card);
    });

    function grade(card){
      const id=card.dataset.id,p=getProblem(id),selected=state.answers[id];
      if(selected===undefined){const r=$('.result',card);r.className='result no';r.textContent='먼저 답을 선택해 주세요.';return false}
      const correct=Number(selected)===p.answer;
      state.attempts[id]=(state.attempts[id]||0)+1;
      state.history[id]=state.history[id]||[];
      state.history[id].push({at:nowIso(),choice:Number(selected),correct});
      if(correct){state.passed[id]=true;state.passedAt[id]=nowIso();delete state.trainingCenterRestored[id];if(state.selfPassed)delete state.selfPassed[id];if(state.selfPassedAt)delete state.selfPassedAt[id];sessionPassed.add(id)}
      state.checked[id]=correct;persist();renderCard(card);return correct
    }
    function updateDashboard(){
      const visible=problems.filter(p=>{const card=$(`.question[data-id="${p.id}"]`);return card&&!card.hidden&&!card.classList.contains('repeat-filter-hidden')});
      const solved=visible.filter(p=>(state.attempts[p.id]||0)>0).length;
      const correct=visible.filter(p=>state.checked[p.id]===true).length;
      const wrong=problems.reduce((n,p)=>n+wrongCount(p.id),0);
      $('#progressText').textContent=`채점 ${solved} / ${visible.length} · 정답 ${correct} · 누적 오답 ${wrong}`;
      $('#progressFill').style.width=(visible.length?solved/visible.length*100:100)+'%';
      let empty=$('#emptyState');if(!empty){empty=document.createElement('p');empty.id='emptyState';empty.className='notice';$('#questions').before(empty)}empty.hidden=visible.length>0;empty.textContent='현재 선택한 범위에 훈련할 문제가 없습니다.';
    }
    updateDashboard();
    const questionOrder=$$('.question').map((card,index)=>({card,index}));
    function sortKeys(entry){const id=entry.card.dataset.id,history=state.history[id]||[],last=history.length?Date.parse(history[history.length-1].at)||0:0;return{...entry,recurrent:Boolean(getProblem(id)?.recurrenceOf),wrong:wrongCount(id),attempts:state.attempts[id]||0,last,added:entry.card.dataset.addedDate||''}}
    function applySort(){if(starView)return;const mode=$('#sortOrder').value,list=questionOrder.map(sortKeys);list.sort((a,b)=>{
      if(mode==='repeatWrong')return Number(b.recurrent)-Number(a.recurrent)||b.added.localeCompare(a.added)||b.index-a.index;
      if(mode==='wrong')return b.wrong-a.wrong||b.attempts-a.attempts||a.index-b.index;
      if(mode==='unattempted')return Number(a.attempts>0)-Number(b.attempts>0)||a.index-b.index;
      if(mode==='recentAttempt')return b.last-a.last||a.index-b.index;
      if(mode==='recentRegistered')return b.added.localeCompare(a.added)||b.index-a.index;
      return a.index-b.index});
      const box=$('#questions');list.forEach(x=>{x.card.classList.toggle('repeat-filter-hidden',mode==='repeatWrong'&&!x.recurrent);box.appendChild(x.card)});updateDashboard()}
    $('#sortOrder').addEventListener('change',applySort);
    applySort();
    $('#fileName').addEventListener('input',e=>{state.fileName=e.target.value;persist()});
    $('#koAuto').addEventListener('change',e=>{state.koAuto=e.target.checked;persist();resetKoreanBuffers()});
    $('#copyPath').addEventListener('click',async()=>{
      const path='D:\\00. 학습센터\\기출문제 연습코너\\또 틀렸다!';
      try{await navigator.clipboard.writeText(path);$('#saveStatus').textContent='폴더 경로를 복사했습니다.'}catch(e){$('#saveStatus').textContent='폴더 경로를 복사하지 못했습니다. 화면의 경로를 직접 선택해 복사해 주세요.'}
    });

    function safeFileName(raw,suffix=''){
      let name=(raw||'이론_오답학습기록').replace(/[<>:"/\\|?*\x00-\x1F]/g,'-').trim().replace(/\.+$/,'');
      name=name.replace(/\.md$/i,'');return `${name}${suffix}.md`
    }
    function fmtDate(iso){try{return new Intl.DateTimeFormat('ko-KR',{dateStyle:'medium',timeStyle:'medium'}).format(new Date(iso))}catch(e){return iso}}
    function isToday(iso){
      const d=new Date(iso);if(Number.isNaN(d.getTime()))return false;
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`===localDate()
    }
    function todayRecords(){return problems.map(p=>({p,history:(state.history[p.id]||[]).filter(h=>!h.cancelledAt&&isToday(h.at))})).filter(x=>x.history.length)}
    function buildMarkdown(list=todayRecords()){
      const attempts=list.reduce((n,x)=>n+x.history.length,0);
      const correct=list.reduce((n,x)=>n+x.history.filter(h=>h.correct).length,0);
      const totalWrong=attempts-correct;
      const lines=[
        '# 전산회계 1급 이론 오늘 학습기록','',
        `- 학습일: ${localDate()}`,
        `- 저장 시각: ${fmtDate(nowIso())}`,
        `- 오늘 채점한 문제: ${list.length}문제`,
        `- 오늘 채점 시도: ${attempts}회`,
        `- 오늘 정답 시도: ${correct}회`,
        `- 오늘 오답 시도: ${totalWrong}회`,
        '- 기록 범위: 오늘 채점한 문제와 오늘의 답변 이력',''
      ];
      list.forEach(({p,history},i)=>{
        const last=history[history.length-1];
        lines.push(`## ${i+1}. ${p.type}`,'',`**문제:** ${p.prompt}`,'');
        if(p.data)lines.push('**자료:**','',...p.data.split('\n').map(x=>`- ${x}`),'');
        p.choices.forEach((c,n)=>lines.push(`- ${circled[n]} ${c}`));
        lines.push('',`- 오늘 마지막 선택: ${choiceText(p,last.choice)}`,`- 정답: ${choiceText(p,p.answer)}`,`- 오늘 마지막 결과: ${last.correct?'정답':'오답'}`,...(state.selfPassed?.[p.id]?[`- 스스로 정답 인정(통과): ${new Date(state.selfPassedAt?.[p.id]||0).toLocaleString('ko-KR')}`]:[]),`- 오늘 채점 횟수: ${history.length}회`,`- 오늘 틀린 횟수: ${history.filter(h=>h.correct===false&&!h.cancelledAt).length}회`,'','**오늘 답변 이력:**');
        history.forEach((h,n)=>lines.push(`- ${n+1}차 (${fmtDate(h.at)}): ${choiceText(p,h.choice)} → ${h.source==='notebook'?'노트 학습 · 직접 표시 / ':''}${h.correct?'정답':'오답'}`));
        lines.push('',`**핵심 학습 내용:** ${p.key}`,'',`**해설:** ${p.explanation}`,'','---','');
      });
      const starredList=problems.filter(p=>Boolean(state.starred?.[p.id]));
      if(starredList.length){
        lines.push('## ★ 특별 훈련이 필요한 문제 (사용자 표시)','','사용자가 「★ 특별 훈련」으로 표시한 문제입니다. 응용문제가 없는 문제는 같은 구조로 숫자·보기를 바꾼 응용문제를 **1개씩만** 만들어 새 고유 id로 추가하고 `variantOf`에 원문제 id를 문자열로 적어 주세요(이론은 id가 문자열이므로 따옴표로 감싼 원문제 id를 그대로 씁니다).','');
        starredList.forEach(p=>{
          const hasVariant=problems.some(q=>q.variantOf===p.id);
          const preview=p.prompt.length>44?p.prompt.slice(0,44)+'…':p.prompt;
          lines.push(`- [${p.id}] ${p.type} — ${preview} · 표시 ${fmtDate(state.starredAt?.[p.id]||'')} · 응용문제 ${hasVariant?'있음':`없음 → 추가 필요 (variantOf:'${p.id}')`}`);
        });
        lines.push('');
      }
      lines.push('## AI에게 전달할 요청 예시','', '> 오늘 학습기록에서 틀린 문제와 헷갈린 개념을 분석하고, 전산회계 1급 수준의 응용문제를 만들어 주세요. 원본 문제의 핵심 구조는 유지하되 숫자와 보기를 바꾸고, 정답과 해설은 처음에는 숨겨 주세요.','');
      return lines.join('\n')
    }
    function todayRecordPayload(){const list=todayRecords();return list.length?{date:localDate(),fileName:safeFileName($('#fileName').value,'_오늘'),content:buildMarkdown(list),problemCount:list.length}:null}
    async function saveTodayRecord(){
      const payload=todayRecordPayload(),status=$('#saveStatus');
      if(!payload){status.textContent='오늘 채점한 학습 기록이 없습니다. 문제를 채점한 뒤 저장해 주세요.';return}
      const name=payload.fileName,content=payload.content;
      let fallbackMessage='';
      if(await window.TrainingGitHub?.canSaveRemote?.()){
        status.textContent='오늘 학습기록을 GitHub에 저장하고 있습니다.';
        try{await window.TrainingGitHub.saveDailyRecord('theory',payload.date,content);status.textContent='오늘 이론 학습기록을 GitHub에 저장했습니다.';return}
        catch(error){fallbackMessage=`GitHub 저장에 실패하여 이 기기에 저장합니다. (${error?.message||'연결 오류'}) `}
      }
      try{
        if('showSaveFilePicker' in window){
          const handle=await window.showSaveFilePicker({suggestedName:name,types:[{description:'Markdown 학습기록',accept:{'text/markdown':['.md']}}]});
          const writable=await handle.createWritable();await writable.write(content);await writable.close();status.textContent=`${fallbackMessage}${handle.name} 파일로 저장했습니다.`;return
        }
      }catch(e){if(e.name==='AbortError'){status.textContent='저장을 취소했습니다.';return}}
      const blob=new Blob([content],{type:'text/markdown;charset=utf-8'}),a=document.createElement('a');
      a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
      status.textContent=`${fallbackMessage}${name} 다운로드를 시작했습니다. 다운로드된 파일을 ‘또 틀렸다!’ 폴더에 보관해 주세요.`
    }
    $('#saveToday').addEventListener('click',saveTodayRecord);
    $('#resetProgress').addEventListener('click',()=>{
      if(!confirm('이 문제의 선택 답과 채점 이력을 모두 지울까요?'))return;
      const keepName=$('#fileName').value;state=defaultState();state.fileName=keepName;localStorage.setItem(STORAGE_KEY,JSON.stringify(state));location.reload()
    });

    // 영문 자판 상태에서도 일반적인 두벌식 한글 입력을 돕는 간단한 조합기
    const C_MAP={r:'ㄱ',R:'ㄲ',s:'ㄴ',e:'ㄷ',E:'ㄸ',f:'ㄹ',a:'ㅁ',q:'ㅂ',Q:'ㅃ',t:'ㅅ',T:'ㅆ',d:'ㅇ',w:'ㅈ',W:'ㅉ',c:'ㅊ',z:'ㅋ',x:'ㅌ',v:'ㅍ',g:'ㅎ'};
    const V_MAP={k:'ㅏ',o:'ㅐ',i:'ㅑ',O:'ㅒ',j:'ㅓ',p:'ㅔ',u:'ㅕ',P:'ㅖ',h:'ㅗ',y:'ㅛ',n:'ㅜ',b:'ㅠ',m:'ㅡ',l:'ㅣ'};
    const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    const JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
    const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    const V_COMB={'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'};
    const F_COMB={'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'};
    const isC=x=>CHO.includes(x),isV=x=>JUNG.includes(x);
    function romanToHangul(raw){
      const j=[...raw].map(x=>C_MAP[x]||V_MAP[x]||x);let out='',i=0;
      while(i<j.length){
        const x=j[i];
        if(isC(x)&&isV(j[i+1])){
          let cho=CHO.indexOf(x),v=j[i+1];i+=2;
          if(isV(j[i])&&V_COMB[v+j[i]]){v=V_COMB[v+j[i]];i++}
          let f='';
          if(isC(j[i])&&JONG.includes(j[i])){
            const c1=j[i],c2=j[i+1],after=j[i+2];
            if(isV(c2)){}
            else if(isC(c2)&&F_COMB[c1+c2]&&!isV(after)){f=F_COMB[c1+c2];i+=2}
            else{f=c1;i++}
          }
          out+=String.fromCharCode(0xAC00+cho*588+JUNG.indexOf(v)*28+JONG.indexOf(f));
        }else if(isV(x)&&isV(j[i+1])&&V_COMB[x+j[i+1]]){out+=V_COMB[x+j[i+1]];i+=2}
        else{out+=x;i++}
      }
      return out
    }
    function resetKoreanBuffers(){$$('[data-ko-auto]').forEach(x=>{x.dataset.koRaw='';x.dataset.koBase=x.value})}
    function setupKoreanInput(field){
      field.dataset.koRaw='';field.dataset.koBase=field.value;
      field.addEventListener('focus',()=>{field.dataset.koRaw='';field.dataset.koBase=field.value});
      field.addEventListener('blur',()=>{field.dataset.koRaw='';field.dataset.koBase=field.value});
      field.addEventListener('keydown',e=>{
        if(!$('#koAuto').checked||e.ctrlKey||e.altKey||e.metaKey)return;
        const raw=field.dataset.koRaw||'',atEnd=field.selectionStart===field.value.length&&field.selectionEnd===field.value.length;
        if(e.key==='Backspace'&&raw&&atEnd){e.preventDefault();const next=raw.slice(0,-1);field.dataset.koRaw=next;field.value=(field.dataset.koBase||'')+romanToHangul(next);field.dispatchEvent(new Event('input',{bubbles:true}));return}
        if(/^[A-Za-z]$/.test(e.key)&&atEnd){e.preventDefault();if(!raw)field.dataset.koBase=field.value;const next=raw+e.key;field.dataset.koRaw=next;field.value=(field.dataset.koBase||'')+romanToHangul(next);field.dispatchEvent(new Event('input',{bubbles:true}));return}
        field.dataset.koRaw='';field.dataset.koBase=field.value
      })
    }
    $$('[data-ko-auto]').forEach(setupKoreanInput);
    function buildStarView(){
      if(!starView)return;
      document.title='★ 특별 훈련 · 이론';
      const sortLabel=$('.sort-label');if(sortLabel)sortLabel.hidden=true;
      const title=$('.section-title');if(title)title.hidden=true;
      $$('.nav-link').forEach(a=>{const on=a.classList.contains('nav-star');a.classList.toggle('active',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
      const current=document.querySelector('.nav-current');if(current)current.textContent='★ 특별 훈련';
      const box=$('#questions'),groups=new Map();
      $$('.question').filter(c=>!c.hidden).forEach(card=>{const p=getProblem(card.dataset.id);if(!groups.has(p.type))groups.set(p.type,[]);groups.get(p.type).push(card)});
      const tools='<div class="star-tools"><button class="btn secondary star-open-all" type="button">보기</button><button class="btn secondary star-close-all" type="button">접기</button></div>';
      if(!groups.size){box.innerHTML='<div class="notice">★ 표시한 문제가 아직 없습니다. 「이론 오답」에서 문제 아래의 「★ 특별 훈련」 버튼을 누르면 이곳에 유형별로 모입니다.</div>';return}
      const wrap=document.createElement('div');wrap.className='star-view';wrap.innerHTML=tools;
      groups.forEach((cards,type)=>{
        const group=document.createElement('section');group.className='star-group';group.innerHTML=`<h2 class="star-group-title">${type}<small>${cards.length}문제</small></h2>`;
        cards.sort((a,b)=>{
          const pa=getProblem(a.dataset.id),pb=getProblem(b.dataset.id);
          const ka=pa.variantOf!=null?String(pa.variantOf):pa.id,kb=pb.variantOf!=null?String(pb.variantOf):pb.id;
          return ka.localeCompare(kb,'ko')||Number(pa.variantOf!=null)-Number(pb.variantOf!=null)||problems.indexOf(pa)-problems.indexOf(pb);
        });
        cards.forEach(card=>{
          const p=getProblem(card.dataset.id),attempts=state.attempts[p.id]||0,preview=p.prompt.length>50?p.prompt.slice(0,50)+'…':p.prompt,item=document.createElement('details');item.className='star-item';
          item.innerHTML=`<summary><span class="qnum">${problems.indexOf(p)+1}</span><span>${preview}</span>${p.variantOf!=null?`<span class="tag variant-badge">응용문제</span>`:'<span class="tag">기존 문제</span>'}<span class="star-item-meta">채점 ${attempts}회 · 틀림 ${wrongCount(p.id)}회${state.passed?.[p.id]?' · 통과':''}</span></summary>`;
          item.appendChild(card);group.appendChild(item);
        });
        wrap.appendChild(group);
      });
      wrap.insertAdjacentHTML('beforeend',tools);box.replaceChildren(wrap);
      $$('.star-open-all').forEach(b=>b.addEventListener('click',()=>$$('details.star-item').forEach(d=>{d.open=true})));
      $$('.star-close-all').forEach(b=>b.addEventListener('click',()=>$$('details.star-item').forEach(d=>{d.open=false})));
    }
    buildStarView();
    (function(){
    if(typeof window.TrainingGitHub?.installSyncBar!=='function'){const button=document.querySelector('#syncAll');if(button)button.addEventListener('click',()=>alert('동기화 기능을 불러오지 못했습니다. Ctrl+F5로 새로고침한 뒤 다시 눌러주세요.'));return}
    TrainingGitHub.installSyncBar({onNeedToken:({mobile})=>{if(mobile)TrainingGitHub.showToast('처음 한 번만 오답 훈련센터 홈 아래쪽에서 GitHub 토큰을 연결한 뒤 다시 눌러주세요.',8000)}});
  })();
</script>
<script>TrainingSeason.install(problems,{state,theory:true,save:persist,refresh:updateDashboard});</script>
