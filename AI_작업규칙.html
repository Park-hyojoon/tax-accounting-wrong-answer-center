<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>현재 AI 작업 규칙 · 오답 학습센터</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f8fb;color:#17324d;font:17px/1.65 "Malgun Gothic",system-ui,sans-serif}.hero{padding:28px 20px;background:linear-gradient(135deg,#126dbd,#22a28f);color:#fff}.hero>div,main{max-width:1050px;margin:auto}.hero h1{margin:0;font-size:clamp(1.7rem,4vw,2.4rem)}.hero p{margin:8px 0}.hero a{color:#fff;font-weight:900}main{padding:22px 18px 60px}.summary,.group{background:#fff;border:1px solid #d4e2ec;border-radius:18px;box-shadow:0 8px 22px #1f4f7712}.summary{padding:18px;margin-bottom:16px}.summary strong{font-size:1.45rem}.toolbar{position:sticky;top:0;display:flex;gap:8px;padding:10px 0;background:#f4f8fb;z-index:2}.toolbar button,.toolbar input{min-height:42px;border:2px solid #bdd6e8;border-radius:10px;background:#fff;padding:7px 11px;font:inherit}.toolbar button{font-weight:900;cursor:pointer}.toolbar button.active{background:#1877d2;border-color:#1877d2;color:#fff}.toolbar input{flex:1}.group{margin:0 0 14px;overflow:hidden}.group h2{margin:0;padding:14px 17px;background:#edf7ff;font-size:1.18rem}.rule{display:grid;grid-template-columns:42px 1fr auto;gap:10px;padding:13px 17px;border-top:1px solid #e1eaf1}.number{color:#8293a1;font-weight:900}.rule strong{display:block}.rule small{display:block;color:#61778a;margin-top:3px}.badge{padding:3px 8px;border-radius:999px;background:#e8f8ef;color:#14734b;font-size:.78rem;font-weight:900}.badge.task{background:#edf6ff;color:#305d86}.empty{text-align:center;padding:25px;color:#60758a}@media(max-width:650px){.rule{grid-template-columns:34px 1fr}.badge{grid-column:2;justify-self:start}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}}
  </style>
</head>
<body>
  <header class="hero"><div><p>전산회계 1급 · 오답 학습센터</p><h1>현재 AI 작업 규칙</h1><p>정리된 핵심 규칙과 작업별 규칙만 표시합니다.</p><p><a href="오답_훈련센터.html">← 학습센터 홈으로</a></p></div></header>
  <main>
    <section class="summary"><strong id="count">0개 규칙</strong><br>과거 상태값·완료된 변경 내역·중복·픽셀 단위 지시는 제거했습니다.</section>
    <div class="toolbar"><button class="active" data-kind="all">전체</button><button data-kind="core">핵심 보호</button><button data-kind="task">작업별</button><input id="search" type="search" placeholder="규칙 검색"></div>
    <div id="groups"></div><p class="empty" id="empty" hidden>조건에 맞는 규칙이 없습니다.</p>
  </main>
  <script>
    const data=[
      ['핵심 보호',[
        ['core','이전 시즌을 현재 학습과 합치지 않는다.','현재 시즌은 exam-20260914 하나다.'],
        ['core','원문과 답안을 제공된 그대로 보존한다.','없는 회차·번호·날짜·실수 이유를 추정하지 않는다.'],
        ['core','개인 원문·증빙·토큰·백업을 공개하지 않는다.','공개 프로그램과 개인 자료를 분리한다.'],
        ['core','기존 문제와 모든 학습 이력을 보존한다.','강제 덮어쓰기와 강제 push를 하지 않는다.'],
        ['core','정답이 불확실하면 등록하지 않는다.','자료의 모순이나 부족을 먼저 확인한다.'],
        ['core','매도가능증권 계정코드는 178만 정답이다.','계정명과 코드가 모두 맞아야 한다.']]],
      ['응용문제',[
        ['task','원본당 대표 응용문제 1개를 만든다.','사용자가 수량을 지정하면 그 수량을 우선한다.'],
        ['task','숫자·날짜·거래처만 조금 바꾼다.','원래 개념과 난이도를 유지한다.'],
        ['task','제목에서 정답을 노출하지 않는다.','정답 계정·유형 번호·과세 결론을 숨긴다.'],
        ['task','표와 증빙은 같은 구조로 재현한다.','풀이 자료를 한 줄 문장으로 축약하지 않는다.'],
        ['task','문제 아래에서 채점하고 정답을 확인할 수 있게 한다.','기존 접힌 정답과 채점 화면을 사용한다.']]],
      ['빠른 등록',[
        ['task','info와 분야 sample을 필요한 만큼만 확인한다.','전체 문서와 원장을 매번 읽지 않는다.'],
        ['task','하루분은 spec 하나와 add 한 번으로 등록한다.','originals와 items를 함께 처리한다.'],
        ['task','check 한 번이 통과하면 끝낸다.','성공한 검사를 반복하지 않는다.'],
        ['task','문제를 기존 목록 맨 뒤에 추가한다.','인덱스와 저장 키를 바꾸지 않는다.'],
        ['core','회차별 원문 Markdown을 반드시 남긴다.','같은 회차는 같은 파일에 덧붙인다.']]],
      ['재제출과 특별훈련',[
        ['core','재전송과 증빙 보완은 새 실패가 아니다.','직접 제출 건수를 부풀리지 않는다.'],
        ['task','같은 문제 재제출은 새 id와 recurrenceOf로 연결한다.','같은 문제는 2회째부터 표시한다.'],
        ['task','유사 유형과 큰 개념은 직접 제출 3회 이상부터 표시한다.','AI 생성과 훈련 오답은 직접 제출 건수에 더하지 않는다.'],
        ['task','2026-09-26 이후 훈련 오답을 특별훈련에 모은다.','이후 정답·통과면 제외하고 재오답이면 다시 포함한다.'],
        ['core','취소·삭제·기준일 이전 기록을 현재 판정에서 제외한다.','날짜 없는 누적 횟수만으로 포함하지 않는다.']]],
      ['채점과 기록',[
        ['task','이론·일반전표·매입매출전표만 운영한다.','결산과 장부 조회는 KcLep에서 훈련한다.'],
        ['task','일반전표는 행 순서와 관계없이 채점한다.','계정·차대·금액·필수 정보가 모두 맞아야 한다.'],
        ['task','매입매출전표 항목을 독립 채점한다.','필요하면 카드사·영세율·불공제 사유도 확인한다.'],
        ['task','공급대가와 부가세 계산 계약을 유지한다.','14·17·22·57·61은 분리, 11·51·54는 기본 10%다.'],
        ['core','통과·오답·취소 이력을 보존한다.','통과를 삭제로 바꾸지 않고 다시 학습할 수 있게 한다.']]],
      ['동기화·배포·화면',[
        ['core','같은 시즌의 PC·모바일 기록만 합친다.','한쪽 기록을 덮어쓰지 않는다.'],
        ['core','학습기록은 사용자가 버튼을 눌렀을 때만 전송한다.','자동 전송을 추가하지 않는다.'],
        ['task','새 문제 검사 후 공개 프로그램을 일반 push한다.','원격 충돌이 있으면 중단한다.'],
        ['task','UI는 사용자가 요청했을 때만 바꾼다.','문제 등록을 화면 개편으로 확대하지 않는다.'],
        ['task','공통 기능은 공유 JS와 CSS로 유지한다.','외부 UI 도구·빌드·AI 호출을 추가하지 않는다.'],
        ['task','실행한 검사만 보고한다.','완료 보고는 변경·검사·동기화 안내만 짧게 전한다.']]]
    ];
    const host=document.getElementById('groups'),items=[];let n=0;for(const [title,rules] of data){const section=document.createElement('section');section.className='group';section.innerHTML=`<h2>${title}</h2>`;for(const [kind,text,note] of rules){n++;const row=document.createElement('div');row.className='rule';row.dataset.kind=kind;row.dataset.search=(title+' '+text+' '+note).toLowerCase();row.innerHTML=`<span class="number">${n}</span><span><strong></strong><small></small></span><span class="badge ${kind==='task'?'task':''}">${kind==='core'?'핵심 보호':'작업별'}</span>`;row.querySelector('strong').textContent=text;row.querySelector('small').textContent=note;section.append(row);items.push(row)}host.append(section)}document.getElementById('count').textContent=n+'개 규칙';let kind='all';const search=document.getElementById('search');function render(){const q=search.value.trim().toLowerCase();let shown=0;for(const item of items){item.hidden=!((kind==='all'||item.dataset.kind===kind)&&(!q||item.dataset.search.includes(q)));if(!item.hidden)shown++}for(const group of document.querySelectorAll('.group'))group.hidden=![...group.querySelectorAll('.rule')].some(x=>!x.hidden);document.getElementById('empty').hidden=shown>0}document.querySelectorAll('[data-kind]').forEach(button=>button.onclick=()=>{kind=button.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===button));render()});search.oninput=render;
  </script>
</body></html>
